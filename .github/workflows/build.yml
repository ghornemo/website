name: Build

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::817009059025:role/GitHubActionsGemalDev
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build application
        run: mvn clean package -DskipTests

      - name: Build Docker image
        run: docker build -t gemal-world .

      - name: Push Docker image to ECR
        run: |
          docker tag gemal-world:latest 817009059025.dkr.ecr.us-east-1.amazonaws.com/gemal-world:latest
          docker tag gemal-world:latest 817009059025.dkr.ecr.us-east-1.amazonaws.com/gemal-world:${{ github.sha }}

          docker push 817009059025.dkr.ecr.us-east-1.amazonaws.com/gemal-world:latest
          docker push 817009059025.dkr.ecr.us-east-1.amazonaws.com/gemal-world:${{ github.sha }}